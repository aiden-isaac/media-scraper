[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-scraper"
version = "0.1.0"
description = "Topic research scraper: plans research with an OpenAI-compatible LLM, gathers from web/news/RSS/social via Playwright, and exports a Markdown report."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "openai>=1.30",
    "feedparser>=6.0",
    "ddgs>=6.0",
    "rich>=13.0",
]

[project.scripts]
media-scraper = "media_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
